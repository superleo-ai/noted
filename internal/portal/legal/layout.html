{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>{{.Title}} · Noted</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{.Stylesheet}}">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/" aria-label="Noted 首页">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#1F5BFF"/><path d="M20 46V18h5.2l13.6 19.4V18H44v28h-5.2L25.2 26.6V46z" fill="#fff"/></svg>
      <span>Noted</span>
    </a>
  </div>
</header>
<main class="doc">
  <div class="wrap doc-in">
    <article class="doc-card">
{{template "content" .}}
    </article>
    <nav class="doc-nav" aria-label="政策">
      <a href="/privacy">隐私政策 Privacy</a>
      <a href="/terms">用户协议 Terms</a>
      <a href="/support">支持 Support</a>
      <a href="/">Noted 首页</a>
    </nav>
  </div>
</main>
</body>
</html>
{{end}}
